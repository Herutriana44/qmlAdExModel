name: Amplitude Classification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Amplitude Classification
        run: python qml_amplitude_pipeline.py --task classification

      - name: Upload CSV outputs (Amplitude classification)
        uses: actions/upload-artifact@v4
        with:
          name: amplitude-classification-csv
          path: |
            eval_classification_amplitude*.csv
          if-no-files-found: error
