name: Run pipelines and upload CSVs

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all pipelines
        run: |
          python qml_angle_pipeline.py
          python qml_amplitude_pipeline.py
          python adex_qml_pipeline.py

      - name: Upload CSV outputs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-csv
          path: |
            **/*.csv
          if-no-files-found: error
