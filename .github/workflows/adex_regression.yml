name: AdEx Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AdEx Regression
        run: python adex_qml_pipeline.py --task regression

      - name: Upload CSV outputs (AdEx regression)
        uses: actions/upload-artifact@v4
        with:
          name: adex-regression-csv
          path: |
            eval_regression*.csv
          if-no-files-found: error
